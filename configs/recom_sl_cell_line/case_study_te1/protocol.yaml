EXPERIMENT:
  NAME: 'MiT4SL'
  SETTING: 'cell_line_specific'
  REPEAT_MODE: 'seed_repeats'
  NUM_RUNS: 1
  SPLIT_INDEX: 0

DATA:
  TPM_THRESHOLD: 400

OPTIM:
  NAME: 'Adam'
  LR: 2e-3
  LR_SEARCH_SPACE: [2e-3]
  BETA1: 0.9
  BETA2: 0.999
  EPS: 1e-8
  WEIGHT_DECAY: 0.0

LOSS:
  LAMBDA1: 0.2
  LAMBDA2: 0.2

TRAIN:
  BATCH_SIZE: 512
  BATCH_POS_NEG_RATIO: 1
  CELL_LINE_SPECIFIC_MAX_EPOCHS: 60
  EARLY_STOPPING:
    ENABLED: false
    MONITOR: 'valid_auc'
    PATIENCE: 5

Cell_Line:
  NUM_LAYERS: 64

KG_SAMPLER:
  SAMPLE_NODES: 512
  SAMPLE_LAYERS: 8

SCHEDULER:
  USE_SCHEDULER: true
  STEP_SIZE: 5
  GAMMA: 0.1

SOLVER:
  DEVICE: 0
  SCENARIO: 'recom_cell_crebbp'
  TASK_DATAPATH: './data/Case_study_TE1'
  TASK_CELL_TEMPLATE: '{cell}'
  CELLNX_DATAPATH: './data/Case_study_TE1/{cell}/Multi_5_{cell}_subgraph.pkl'
  CELLPROTEIN_DATAPATH: './data/Case_study_TE1/{cell}/Multi_5_{cell}_proteins.csv'
  REPEAT_EXP_SEED: 0
  MODEL_SEED: 1028
  NEGATIVE_SAMPLING_SEED_BASE: 42
