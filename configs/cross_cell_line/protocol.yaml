EXPERIMENT:
  NAME: 'MiT4SL'
  SETTING: 'cross_cell_line'
  REPEAT_MODE: 'seed_repeats'
  NUM_RUNS: 5

DATA:
  TPM_THRESHOLD: 400

OPTIM:
  NAME: 'Adam'
  LR: 1e-3
  LR_SEARCH_SPACE: [1e-3, 3e-3]
  CROSS_CELL_LINE_SMALL_LR: 3e-3
  CROSS_CELL_LINE_LARGE_LR: 1e-3


LOSS:
  LAMBDA1: 0.2
  LAMBDA2: 0.2

TRAIN:
  BATCH_SIZE: 512
  BATCH_POS_NEG_RATIO: 1
  CROSS_CELL_LINE_POLICY: 'by_train_size'
  CROSS_CELL_LINE_TRAIN_SIZE_THRESHOLD: 5800
  CROSS_CELL_LINE_SMALL_MAX_EPOCHS: 120
  CROSS_CELL_LINE_LARGE_MAX_EPOCHS: 20
  EARLY_STOPPING:
    ENABLED: false
    MONITOR: 'valid_auc'
    PATIENCE: 5

Cell_Line:
  NUM_LAYERS: 64

KG_SAMPLER:
  SAMPLE_NODES: 512
  SAMPLE_LAYERS: 8

SOLVER:
  DEVICE: 1
  SCENARIO: 'cross_cell_line'
  TASK_DATAPATH: './data/SLbench/Scenario/Cross_cell_line'
